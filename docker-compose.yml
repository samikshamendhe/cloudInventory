services:
  backend:
    build:
      context: ./backend
    container_name: cloudinventory-backend
    expose:
      - "8080"
    environment:
      SERVER_PORT: 8080

  frontend:
    build:
      context: ./frontend
    container_name: cloudinventory-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
