services:

  backend:
    build:
      context: ./backend

    container_name: cloudinventory-backend

    expose:
      - "8080"

    environment:
      SERVER_PORT: 8080

      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      VIEWER_USERNAME: ${VIEWER_USERNAME}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

    volumes:
      # Persistent database storage.
      # Product and order data survives container recreation.
      - cloudinventory-data:/data

  frontend:
    build:
      context: ./frontend

    container_name: cloudinventory-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend


volumes:

  cloudinventory-data:
    name: cloudinventory-data