spring.application.name=cloudinventory

server.port=${SERVER_PORT:8082}

# Persistent H2 database.
# The database is stored in /data inside the backend container.
spring.datasource.url=jdbc:h2:file:/data/cloudinventorydb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# Disable the Open Session in View warning and keep database
# access inside the application's service/repository layers.
spring.jpa.open-in-view=false

# Administrator credentials are supplied through environment variables.
app.security.admin-username=${ADMIN_USERNAME}
app.security.admin-password=${ADMIN_PASSWORD}

# Viewer/staff credentials are supplied through environment variables.
app.security.viewer-username=${VIEWER_USERNAME}
app.security.viewer-password=${VIEWER_PASSWORD}

# Base64 encoded secret used for JWT signing and validation.
app.security.jwt-secret=${JWT_SECRET}